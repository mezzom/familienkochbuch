<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Familienkochbuch</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#213b33;font-family:system-ui,sans-serif;font-size:clamp(20px,1.6vw,30px)}button,select{font:inherit;touch-action:manipulation;min-height:68px;border:1px solid #b9c9bc;border-radius:16px;padding:14px 24px;color:inherit;background:white;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid #db8b37;outline-offset:3px}button:disabled{opacity:.4;cursor:default}header{padding:22px 3vw;background:#183e34;color:white;display:flex;align-items:center;justify-content:space-between;gap:16px}header small{display:block;font-size:.65em;margin-top:5px;color:#d2e5d4}header button{font-size:.7em;background:#2a5546;color:white}main{max-width:1920px;margin:auto;padding:24px 3vw}.bar{display:flex;gap:20px;align-items:center;margin-bottom:24px}.bar label{font-size:.8em}select{flex:1;min-width:0}.meta{font-size:.7em}.layout{display:grid;grid-template-columns:36% 1fr;gap:26px}.panel{padding:26px;border-radius:24px;background:white;border:1px solid #e0e5da}h2{font-size:1em;margin:0}.muted{font-size:.7em;color:#627568}ul{list-style:none;padding:0;margin:20px 0 0}li{border-top:1px solid #e4eadd}li label{min-height:74px;display:flex;align-items:center;gap:18px;padding:12px 0;cursor:pointer;font-size:.9em}input{width:32px;height:32px;accent-color:#286343;flex-shrink:0}input:checked+span{text-decoration:line-through;color:#768378}.steps{min-height:610px;display:flex;flex-direction:column}.count{font-size:.7em;text-transform:uppercase;letter-spacing:.1em;color:#53725d}.track{height:8px;background:#e5ecdf;border-radius:10px;margin:16px 0 28px;overflow:hidden}.track div{height:100%;background:#47835b}.body{flex:1}h1{font-size:clamp(30px,3vw,54px);line-height:1.2;margin:12px 0 24px}.instruction{font-size:clamp(24px,2.1vw,40px);line-height:1.5}.nav{display:grid;grid-template-columns:1fr 1.4fr;gap:18px;margin-top:24px}.nav button{min-height:92px;font-weight:700}.primary{background:#245d43;color:white;border-color:#245d43}footer{padding:18px 3vw;font-size:.65em;color:#627568}dialog{border:0;border-radius:24px;padding:30px;max-width:600px;color:#213b33}dialog::backdrop{background:#183e3499}dialog button{margin:6px}@media(max-width:750px){.layout{grid-template-columns:1fr}.bar{flex-wrap:wrap}.meta{width:100%}header{align-items:flex-start}header button{padding:10px}header .tools{display:flex;flex-direction:column;gap:8px}.steps{min-height:480px}.panel{padding:20px}.nav button{padding:12px}}
</style><header><div><strong>🍲 Familienkochbuch</strong><small>Gemeinsam kochen. Schritt für Schritt.</small></div><div class="tools"><button id="full">Vollbild</button> <button id="reset">Neu starten</button></div></header><main><div class="bar"><label for="recipe">Heute kochen wir</label><select id="recipe"></select><span id="meta" class="meta"></span></div><div class="layout"><aside class="panel"><h2>Zutaten</h2><p id="checked" class="muted"></p><ul id="ingredients"></ul></aside><section class="panel steps" aria-label="Kochanleitung"><div id="count" class="count"></div><div class="track" role="progressbar" aria-label="Kochfortschritt" aria-valuemin="0" aria-valuemax="100"><div id="progress"></div></div><div class="body" aria-live="polite" aria-atomic="true"><h1 id="title"></h1><p id="instruction" class="instruction"></p><p id="hint" class="muted"></p><p id="done"></p></div><div class="nav"><button id="prev">← Zurück</button><button id="next" class="primary">Weiter →</button></div><p id="status" class="muted"></p></section></div></main><footer>Beispielrezepte für 4 Personen · Ohne Konto, Werbung oder externe Dienste · Fortschritt bleibt in diesem Browser</footer><dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">Dieses Rezept neu starten?</h2><p>Häkchen und Kochfortschritt werden zurückgesetzt.</p><button id="cancel">Abbrechen</button><button id="confirm" class="primary">Neu starten</button></dialog><script>
'use strict';
const recipes=[{id:'pasta',name:'Cremige Tomatenpasta',time:'25 Minuten',ingredients:['400 g Pasta','1 Zwiebel','2 Knoblauchzehen','2 EL Olivenöl','800 g gehackte Tomaten','100 ml Sahne oder Hafercuisine','1 TL Oregano','Salz und Pfeffer','Basilikum nach Geschmack'],steps:[['Alles vorbereiten','Zwiebel und Knoblauch schälen und fein würfeln. Die übrigen Zutaten bereitstellen. Einen großen Topf mit Wasser für die Pasta aufsetzen.'],['Zwiebel und Knoblauch anbraten','Olivenöl in einer großen Pfanne bei mittlerer Hitze erwärmen. Zwiebel etwa 3 Minuten glasig dünsten. Knoblauch dazugeben und 1 Minute mitdünsten.'],['Sauce köcheln lassen','Tomaten und Oregano dazugeben. Mit Salz und Pfeffer würzen. Bei niedriger bis mittlerer Hitze etwa 15 Minuten köcheln lassen. Gelegentlich umrühren.'],['Pasta kochen','Kochendes Wasser salzen und Pasta nach Packungsangabe bissfest garen. Vor dem Abgießen eine Tasse Nudelwasser auffangen.'],['Alles vermengen','Sahne oder Hafercuisine in die Sauce rühren. Pasta dazugeben. Bei Bedarf etwas Nudelwasser ergänzen, bis die Sauce cremig ist.'],['Servieren','Abschmecken, auf Teller verteilen und nach Wunsch mit Basilikum bestreuen. Guten Appetit!']]},{id:'gemuese',name:'Ofengemüse mit Feta',time:'45 Minuten',ingredients:['800 g Kartoffeln','2 Paprika','1 Zucchini','2 rote Zwiebeln','3 EL Olivenöl','2 TL italienische Kräuter','200 g Feta','Salz und Pfeffer'],steps:[['Vorbereiten','Ofen auf 200 °C Umluft vorheizen. Gemüse waschen. Kartoffeln in etwa 2 cm große Stücke schneiden, Paprika und Zucchini etwas größer. Zwiebeln schälen und in Spalten schneiden.'],['Kartoffeln vorbacken','Kartoffeln mit 2 EL Öl, der Hälfte der Kräuter, Salz und Pfeffer mischen. Auf einem großen Blech verteilen und 15 Minuten backen.'],['Gemüse ergänzen','Restliches Gemüse mit übrigem Öl und Kräutern mischen. Vorsichtig auf das heiße Blech geben und weitere 15 Minuten backen.'],['Feta dazugeben','Feta über das Gemüse bröseln. Weitere 10 Minuten backen, bis die Kartoffeln weich sind. Bei Bedarf länger garen.'],['Servieren','Blech mit Ofenhandschuhen herausnehmen. Gemüse abschmecken und auf Teller verteilen. Guten Appetit!']]},{id:'pfannkuchen',name:'Goldene Pfannkuchen',time:'30 Minuten',ingredients:['250 g Mehl','500 ml Milch','3 Eier','1 Prise Salz','1 EL Zucker (optional)','Butter oder Öl zum Ausbacken','Obst oder Apfelmus'],steps:[['Teig anrühren','Mehl und Salz mischen. Milch nach und nach mit einem Schneebesen einrühren. Eier und nach Wunsch Zucker zugeben. Glatt verrühren.'],['Ruhen lassen','Teig 10 Minuten ruhen lassen. Obst oder Apfelmus und einen Teller für die fertigen Pfannkuchen bereitstellen.'],['Pfanne erhitzen','Etwas Butter oder Öl bei mittlerer Hitze in einer beschichteten Pfanne erhitzen. Eine kleine Kelle Teig hineingeben und durch Schwenken dünn verteilen.'],['Goldbraun backen','Etwa 1 bis 2 Minuten backen, bis die Unterseite goldbraun und die Oberfläche weitgehend gestockt ist. Wenden und etwa 1 Minute weiterbacken. Mit dem restlichen Teig wiederholen.'],['Anrichten','Mit Obst oder Apfelmus servieren. Guten Appetit!']]}];
const $=id=>document.getElementById(id),key='familienkochbuch-v1';let saved={},storage=true;try{saved=JSON.parse(localStorage.getItem(key)||'{}')||{};if(typeof saved!=='object'||Array.isArray(saved))saved={};}catch(e){storage=false;}let r=recipes.find(x=>x.id===saved.active)||recipes[0],step=0,checks=[],done=false;
function save(){saved.active=r.id;saved[r.id]={step,checks,done};try{localStorage.setItem(key,JSON.stringify(saved));}catch(e){storage=false;}$('status').textContent=storage?'Dein Fortschritt wird automatisch gespeichert.':'Browserspeicher nicht verfügbar: Fortschritt nur für diese Sitzung.';}
function load(){const s=saved[r.id]||{};step=Number.isInteger(s.step)?Math.max(0,Math.min(s.step,r.steps.length-1)):0;checks=r.ingredients.map((_,i)=>Array.isArray(s.checks)&&s.checks[i]===true);done=s.done===true&&step===r.steps.length-1;}
function count(){$('checked').textContent=checks.filter(Boolean).length+' von '+checks.length+' abgehakt · 4 Personen';}
function renderStep(){const n=r.steps.length,p=done?100:Math.round(step/n*100);$('count').textContent='Schritt '+(step+1)+' von '+n;$('title').textContent=r.steps[step][0];$('instruction').textContent=r.steps[step][1];$('hint').textContent=step<n-1?'Als Nächstes: '+r.steps[step+1][0]:'Der letzte Schritt – gleich wird gegessen.';$('done').textContent=done?'✓ Geschafft! Lasst es euch schmecken.':'';$('prev').disabled=step===0;$('next').disabled=done;$('next').textContent=done?'Fertig ✓':step===n-1?'Kochen abschließen ✓':'Weiter →';$('progress').style.width=p+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',p);save();}
function render(){$('recipe').value=r.id;$('meta').textContent=r.time+' · 4 Personen';$('ingredients').replaceChildren();r.ingredients.forEach((text,i)=>{const li=document.createElement('li'),label=document.createElement('label'),input=document.createElement('input'),span=document.createElement('span');input.type='checkbox';input.checked=checks[i];span.textContent=text;input.onchange=()=>{checks[i]=input.checked;count();save();};label.append(input,span);li.append(label);$('ingredients').append(li);});count();renderStep();}
recipes.forEach(x=>{const option=document.createElement('option');option.value=x.id;option.textContent=x.name;$('recipe').append(option);});$('recipe').onchange=()=>{r=recipes.find(x=>x.id===$('recipe').value);load();render();};$('prev').onclick=()=>{if(step>0){step--;done=false;renderStep();}};$('next').onclick=()=>{if(step<r.steps.length-1)step++;else done=true;renderStep();};$('reset').onclick=()=>$('dialog').showModal();$('cancel').onclick=()=>$('dialog').close();$('confirm').onclick=()=>{step=0;checks=r.ingredients.map(()=>false);done=false;render();$('dialog').close();};$('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('status').textContent='Vollbild wird von diesem Browser nicht unterstützt.';}};document.addEventListener('fullscreenchange',()=>{$('full').textContent=document.fullscreenElement?'Vollbild beenden':'Vollbild';});load();render();
</script></html>
